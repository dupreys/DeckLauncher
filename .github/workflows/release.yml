name: Release

# Publica uma versão quando uma tag "v*" é enviada (ex.: git tag v1.0.0 && git push origin v1.0.0).
# A release contém só o instalador (DeckLauncher-Setup-<versão>.exe), gerado com o Inno Setup (installer/DeckLauncher.iss).
# Também dá para rodar à mão em Actions > Release > Run workflow (gera o instalador sem criar a release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Versão
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG
          if ($tag -match '^v(\d+\.\d+(\.\d+)*)$') { $version = $Matches[1] } else { $version = "0.0.0-dev" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Testes
        run: dotnet test DeckLauncher.sln -c Release

      - name: Publicar o programa (autônomo, não precisa do .NET instalado)
        run: >
          dotnet publish src/DeckLauncher.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }} -o out/app

      # Windows PowerShell 5.1 (e não o pwsh 7): os cmdlets de certificado (New-SelfSignedCertificate...) funcionam direto nele.
      # Se o pacote do Modo Xbox falhar, a release sai sem essa opção (o instalador detecta a ausência) e um aviso aparece na execução.
      - name: Gerar o pacote do Modo Xbox
        shell: powershell
        continue-on-error: true
        run: .\fse\Build-Fse.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Conferir o pacote do Modo Xbox
        shell: pwsh
        run: |
          if (Test-Path out\fse\DeckLauncherFSE.msix) { Write-Host "Pacote do Modo Xbox gerado." }
          else { Write-Host "::warning::O pacote do Modo Xbox NÃO foi gerado: o instalador sairá sem a opção Modo Xbox. Veja o passo anterior."; if (Test-Path out\fse) { Remove-Item out\fse -Recurse -Force } }

      - name: Instalar o Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Gerar o instalador
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$v" installer\DeckLauncher.iss
          if ($LASTEXITCODE -ne 0) { throw "Falha ao gerar o instalador" }
          Get-ChildItem dist

      - name: Guardar os arquivos desta execução
        uses: actions/upload-artifact@v4
        with:
          name: DeckLauncher-${{ steps.version.outputs.version }}
          path: dist/*

      - name: Criar a release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
