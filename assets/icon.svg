<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B2A9C"/>
      <stop offset="0.55" stop-color="#1B3A78"/>
      <stop offset="1" stop-color="#0B1426"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#1A9FFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1A9FFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pad" gradientUnits="userSpaceOnUse" x1="0" y1="150" x2="0" y2="432">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B9C7E0"/>
    </linearGradient>
    <clipPath id="sq"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <g clip-path="url(#sq)">
    <rect x="16" y="16" width="480" height="480" fill="url(#glow)"/>
    <!-- soft floor shadow -->
    <ellipse cx="256" cy="430" rx="170" ry="20" fill="#000" opacity="0.28"/>
  </g>
  <!-- controller body: centre bar + two angled grips -->
  <g fill="url(#pad)">
    <rect x="86" y="150" width="340" height="168" rx="84"/>
    <rect x="92" y="236" width="118" height="196" rx="59" transform="rotate(16 151 334)"/>
    <rect x="302" y="236" width="118" height="196" rx="59" transform="rotate(-16 361 334)"/>
  </g>
  <!-- d-pad (left) -->
  <g fill="#1B2A4A">
    <rect x="132" y="218" width="76" height="26" rx="8"/>
    <rect x="157" y="193" width="26" height="76" rx="8"/>
  </g>
  <!-- face buttons (right) -->
  <circle cx="340" cy="190" r="17" fill="#59BF3D"/>
  <circle cx="370" cy="220" r="17" fill="#1A9FFF"/>
  <circle cx="310" cy="220" r="17" fill="#1B2A4A"/>
  <circle cx="340" cy="250" r="17" fill="#1B2A4A"/>
  <!-- sticks -->
  <circle cx="220" cy="272" r="27" fill="#1B2A4A"/>
  <circle cx="220" cy="272" r="15" fill="#2E4373"/>
  <circle cx="292" cy="272" r="27" fill="#1B2A4A"/>
  <circle cx="292" cy="272" r="15" fill="#2E4373"/>
  <!-- centre buttons -->
  <rect x="233" y="190" width="18" height="10" rx="5" fill="#1B2A4A" opacity="0.7"/>
  <rect x="261" y="190" width="18" height="10" rx="5" fill="#1B2A4A" opacity="0.7"/>
</svg>
